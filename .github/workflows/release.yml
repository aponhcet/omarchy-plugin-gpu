name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plugin checks
        run: bash test/qa.sh
      - name: Tag matches the manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version manifest.json)
          if [[ "$tag" != "$manifest" ]]; then
            echo "tag v$tag does not match manifest $manifest" >&2
            exit 1
          fi
          if ! grep -qx "## $manifest" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $manifest" >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes=$(mktemp)
          awk -v version="$version" '
            $0 == "## " version { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md | sed '/./,$!d' >"$notes"
          [[ -s "$notes" ]]
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file "$notes"
